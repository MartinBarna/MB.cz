<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Test: reakce na report (šablona + odkaz do Gmailu)</title>
<!--
  Náhled šablony reakce na týdenní report. Stejný účel jako `pruvodce-test.html`:
  zkontrolovat tvar výstupu, aniž by se sahalo na živá data nebo na AI.

  ⛔ Data na téhle stránce jsou VYMYŠLENÁ. Jméno, adresa ani čísla nepatří žádnému
     skutečnému klientovi a nikdy sem takové údaje nepatří.
  ⛔ Stránka nic neodesílá. Tlačítko jen otevře Gmail s předvyplněným mailem.
  ⚠️ Blok čísel je tu NATVRDO, přesně jak ho vyplivl `report-engine.mjs`. Tahle stránka
     ho nepočítá; počítání hlídá `node scripts/report-reakce-test.mjs`.
-->
<style>
  body{margin:0;background:#0C0B10;color:#F0EADF;font:15px/1.6 -apple-system,Segoe UI,Roboto,Arial,sans-serif;padding:24px}
  h1{font-size:1.1rem;color:#EBB12C;margin:0 0 4px}
  p.m{color:#8F8A99;font-size:.86rem;margin:0 0 18px}
  .box{background:#181520;border:1px solid #262232;border-radius:10px;padding:16px;margin:0 0 16px;max-width:760px}
  label{display:block;font-size:.78rem;color:#8F8A99;margin:0 0 10px}
  input,textarea{width:100%;box-sizing:border-box;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.14);border-radius:8px;padding:8px 11px;color:#fff;font:inherit;margin-top:3px}
  textarea{min-height:360px;line-height:1.55}
  button{background:#EBB12C;color:#1A1222;border:0;border-radius:6px;padding:10px 18px;font-weight:700;cursor:pointer;margin-right:8px}
  code{color:#F6CD63}
</style>
</head>
<body>
<h1>Test: reakce na report</h1>
<p class="m">Vymyšlená data. Nic se neodesílá, tlačítko jen otevře předvyplněný Gmail.</p>

<div class="box">
  <label>Oslovení (5. pád)<input id="vok" value="Testíku"></label>
  <label>Adresa příjemce (test)<input id="komu" value="fitness.barna@gmail.com"></label>
  <label>Datum reportu<input id="datum" value="2026-09-01"></label>
  <label>Téma týdne (volitelné)<input id="tema" value="Bílkoviny a high-protein receptář"></label>
  <label>Odkaz na přílohu (volitelný)<input id="temaurl" value="https://drive.google.com/file/d/TEST/view"></label>
  <button id="prekresli">Přegenerovat</button>
  <!-- ⛔ [7. 9. 2026] Do dneška měla stránka jen JEDEN případ: report s kompletními čísly.
       Vada ADMIN_REPORT_CHYBI_DATA se proto nedala uvidět. Přepínač níž pouští i report,
       ve kterém klient skoro nic nevyplnil, a report úplně prázdný. -->
  <button id="dataPlny">Report s čísly</button>
  <button id="dataChybi">Report s CHYBĚJÍCÍMI daty</button>
  <button id="dataPrazdny">Report úplně prázdný</button>
</div>

<div class="box">
  <p style="margin:0 0 6px">Předmět: <b id="subj"></b></p>
  <textarea id="mail"></textarea>
  <p style="margin:10px 0 0"><button id="gmail">Otevřít v Gmailu</button>
  <span class="m" id="pozn"></span></p>
</div>

<script src="/akademie/admin/report-reakce-sablona.js"></script>
<script>
  // Blok čísel: doslovný výstup `report-engine.mjs` pro vymyšlený report.
  var STAV = [
    "Váha 94,2 kg (od minule -0,6 kg)",
    "Od startu -2,5 kg (start 96,7 kg)",
    "Pas 107 cm (minule 104, +3 cm; od startu -2 cm)",
    "Boky 104 cm (minule 105, -1 cm; od startu -4 cm)",
    "Zápis 7 ze 7 dní",
    "Průměr 2060 kcal (cíl 2000 kcal, +60 kcal)",
    "Bílkoviny 103 g (cíl 160 g, -57 g)",
    "Kroky 6694 (plán 12000, -5306)",
    "Tréninky 0 x (plán 3 x)",
    "Spánek 6,5 h, kvalita 3/5"
  ];
  // ⛔ [7. 9. 2026] Report, ve kterém klient vyplnil skoro nic. Takhle vypadá výstup
  // `report-engine.mjs`: řádek se do bloku PŘIDÁ jen tehdy, když hodnota existuje.
  // Chybějící váha, kalorie ani kroky se nevypíšou jako 0 ani jako „undefined", prostě
  // tam nejsou. Tohle je správné chování a stránka ho teď ukazuje.
  var STAV_CHYBI = [
    "Zápis 2 ze 7 dní",
    "Spánek hodiny neuvedeny, kvalita 2/5"
  ];
  // ⛔ A tohle je ten případ, kvůli kterému vznikla brána v adminu: v reportu není JEDINÉ
  // měřitelné číslo. Blok stavu se pak celý vynechá a mail by byl jen próza od AI, tedy
  // reakce na prázdno. Admin proto koncept v tomhle případě vůbec nenabídne.
  var STAV_PRAZDNY = [];

  // Próza: takhle vypadá to, co vrací AI (bod 4 až 8 kostry).
  var PROZA = [
    "Váha dolů o 0,6 kg a od startu jsi na 2,5 kg. Pas se sice zvedl na 107, ale ten se ti kýve",
    "pořád (109, 105, 107, 104), takže z jednoho měření paniku nedělám. Rozhoduje ta linka dolů.",
    "",
    "Zápis 7 ze 7 dní beru jako hlavní výhru týdne. Tohle je ta laťka, o které jsme se bavili.",
    "",
    "Cíl 2060 kcal nechávám, sedí na zadání a není co snižovat. Co drhne, jsou bílkoviny:",
    "103 g proti cíli 160. A kroky 6 694 proti plánu 12 000, to je půlka.",
    "",
    "Na tenhle týden dvě věci: dostat bílkoviny nad 140 g denně a vrátit kroky přes 10 000.",
    "",
    "Zvládneš to nachodit i ve všední dny, nebo to nacpeme do víkendu? :)"
  ].join("\n");

  // Který případ se právě kreslí. Mění ho tři tlačítka nahoře.
  var AKTIVNI = 'plny';
  function stavRadky(){
    if (AKTIVNI === 'chybi') return STAV_CHYBI;
    if (AKTIVNI === 'prazdny') return STAV_PRAZDNY;
    return STAV;
  }

  // ⛔⛔ [7. 9. 2026] NEJHORŠÍ VARIANTA: v bloku čísel řádek NENÍ, ale próza od AI o tom
  // číslu mluví. Šablona ani engine to nepoznají, protože prózu nečtou. Klientovi pak
  // přijde věta o váze, kterou nikdy nevyplnil. Tahle kontrola to na testovací stránce
  // ukáže; v ostrém adminu si to musí přečíst Martin, než mail odešle.
  function varovaniProza(telo){
    var bloky = [
      { klic: 'Váha', slova: /váh[aouy]|zhubl|přibral/i },
      { klic: 'Kroky', slova: /krok/i },
      { klic: 'Průměr', slova: /kcal|kalori/i },
      { klic: 'Bílkoviny', slova: /bílkovin/i }
    ];
    var radky = stavRadky().join(' ');
    var chybne = bloky.filter(function (b) {
      return radky.indexOf(b.klic) < 0 && b.slova.test(telo);
    }).map(function (b) { return b.klic.toLowerCase(); });
    if (!chybne.length) return '';
    return ' · ⚠️ próza mluví o tom, co v číslech NENÍ: ' + chybne.join(', ');
  }

  function prekresli(){
    var R = window.ReportReakce;
    if(!R){ document.getElementById("pozn").textContent = "Šablona se nenačetla."; return; }
    var vok = document.getElementById("vok").value.trim();
    var datum = document.getElementById("datum").value.trim();
    var predmet = R.predmet(vok, datum);
    var telo = R.telo({
      osloveni: vok, datum: datum, stavRadky: stavRadky(), textAi: PROZA,
      tema: document.getElementById("tema").value.trim(),
      temaOdkaz: document.getElementById("temaurl").value.trim()
    });
    document.getElementById("subj").textContent = predmet;
    document.getElementById("mail").value = telo;
    var g = R.gmailOdkaz(document.getElementById("komu").value.trim(), predmet, telo);
    document.getElementById("pozn").textContent =
      "délka odkazu " + g.delka + " znaků, " + (g.vejdeSe ? "tělo se do odkazu vejde" : "tělo se NEVEJDE, otevře se prázdný mail a text se kopíruje")
      + (AKTIVNI === 'prazdny' ? " · ⚠️ tenhle případ admin vůbec nenabídne, blok čísel je prázdný a engine hlásí chybi_data" : "")
      + (AKTIVNI === 'chybi' ? " · v bloku stavu schválně CHYBÍ řádky váhy, kalorií a kroků, to je správně" : "")
      + varovaniProza(telo);
  }
  document.getElementById("prekresli").addEventListener("click", prekresli);
  [['dataPlny','plny'],['dataChybi','chybi'],['dataPrazdny','prazdny']].forEach(function(par){
    document.getElementById(par[0]).addEventListener("click", function(){ AKTIVNI = par[1]; prekresli(); });
  });
  document.getElementById("gmail").addEventListener("click", function(){
    var R = window.ReportReakce;
    var g = R.gmailOdkaz(document.getElementById("komu").value.trim(),
      document.getElementById("subj").textContent, document.getElementById("mail").value);
    window.open(g.url, "_blank", "noopener");
  });
  window.addEventListener("DOMContentLoaded", prekresli);
  if (window.ReportReakce) prekresli();
</script>
</body>
</html>
