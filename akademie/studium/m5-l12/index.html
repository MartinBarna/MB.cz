<style>
  .bar{height:5px;background:rgba(255,255,255,.06);}
  .bar span{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--gold-soft));transition:width .3s;}
  .top a.back{color:#a89e94;text-decoration:none;font-size:.85rem;font-weight:500;}
  .top a.back:hover{color:#fff;}
  .wrap{max-width:760px;margin:0 auto;padding:34px 20px 80px;}
  .crumb{color:var(--gold-soft);font-size:.74rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;}
  h1{font-size:clamp(1.7rem,4vw,2.1rem);line-height:1.18;color:#fff;margin:.5rem 0 1.3rem;letter-spacing:-.02em;}
  h2{font-size:1.3rem;color:#fff;margin:2.1rem 0 .6rem;letter-spacing:-.01em;}
  p{margin:.75rem 0;color:var(--ink);}
  .lead{font-size:1.1rem;color:#e9e2d8;}
  strong,b{color:#fff;}
  em{color:var(--muted-2);}
  .wrap a{color:var(--gold-soft);}
  .card{background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.02));border:1px solid var(--line);border-radius:16px;padding:1.1rem 1.4rem;margin:1.3rem 0;}
  .praxe{background:rgba(235,177,44,.07);border:1px solid rgba(235,177,44,.25);border-radius:16px;padding:1.1rem 1.4rem;margin:1.3rem 0;}
  .praxe b{color:var(--gold-soft);}
  .points{background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.02));border:1px solid var(--line);border-radius:16px;padding:1.1rem 1.4rem;}
  .points li{margin:.4rem 0 .4rem 1.1rem;}
  .eq{text-align:center;font-weight:800;background:linear-gradient(145deg,#23211e,#0c0c0c);border:1px solid rgba(235,177,44,.3);color:#fff;border-radius:14px;padding:15px;margin:1.2rem 0;letter-spacing:.3px;}
  blockquote{border-left:3px solid var(--gold);padding:.4rem 0 .4rem 1.2rem;color:var(--muted-2);font-style:italic;margin:1.2rem 0;}
  .quiz{background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.02));border:1px solid var(--line);border-radius:18px;padding:1.5rem;margin-top:2.2rem;}
  .quiz h3{font-size:1.15rem;color:#fff;margin-bottom:.3rem;}
  .q{border-top:1px solid var(--line);padding:14px 0;}
  .q:first-of-type{border-top:none;}
  .q .qq{font-weight:600;cursor:pointer;display:flex;gap:10px;color:var(--ink);}
  .q .qq .n{color:var(--gold-soft);font-weight:800;}
  .q .aa{display:none;margin-top:.6rem;color:var(--muted-2);background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:11px;padding:.8rem 1rem;font-size:.95rem;}
  .q.open .aa{display:block;}
  .q .qq .tg{margin-left:auto;color:var(--muted);font-size:.82rem;white-space:nowrap;}
  .done-row{margin-top:2.2rem;display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
  .btn{background:linear-gradient(145deg,var(--gold-2),var(--gold));color:#1A1222;font-weight:700;padding:13px 28px;border-radius:50px;border:none;cursor:pointer;text-decoration:none;display:inline-block;font-family:inherit;box-shadow:0 12px 26px -8px rgba(235,177,44,.22);transition:transform .2s;}
  .btn:hover{transform:translateY(-2px);}
  .btn.ghost{background:rgba(255,255,255,.05);border:1px solid var(--line-2);color:var(--muted-2);box-shadow:none;}
  .btn.ghost:hover{border-color:rgba(235,177,44,.4);color:#fff;transform:none;}
  .btn.is-done{background:linear-gradient(145deg,#2fae57,#1f9647);color:#fff;box-shadow:0 12px 26px -8px rgba(47,174,87,.5);}
  .src{margin-top:2.2rem;font-size:.8rem;color:var(--muted);}
  .src summary{cursor:pointer;font-weight:700;color:var(--muted-2);}
  .src ol{margin:.6rem 0 0 1.1rem;}.src li{margin:.2rem 0;}
  .src a{color:var(--gold-soft);}
</style>

<body class="ba">
  <div class="top"><div class="in">
    <a class="brand" href="/akademie/studium/"><span class="mark">MB</span><span><b>Barna Academy</b><span class="tag">Akademie pro trenéry</span></span></a>
    <a class="back" href="/akademie/moje/">← Zpět na Academy</a>
  </div></div>
  <div class="bar"><span id="rbar"></span></div>

  <div class="wrap">
    <div class="crumb">Modul 5 · Lekce 12: Práce s klientem a koučink</div>
    <h1>Online koučink: vedení na dálku</h1>

  <div id="lbody"><div class="card" style="text-align:center;color:#a89e94;">Načítám lekci…</div></div>

  <div class="done-row">
      <button class="btn" id="doneBtn">Označit jako dokončeno ✓</button>
      <a class="btn ghost" href="/akademie/studium/">Zpět na studium</a>
    </div>
  </div>

  <script src="/assets/ba-config.js?v=20260628b"></script>
  <script src="/assets/ba-academy.js?v=20260728a"></script>
  <script>
    // Placená lekce: obsah se načítá z DB (lesson_content, RLS: has_entitlement)
    // až po ověření přístupu - text lekce není ve statickém HTML.
    var LID='m5-l12', PRODUCT='academy', state={done:false};
    var btn=document.getElementById('doneBtn');
    var rbar=document.getElementById('rbar');
    window.addEventListener('scroll', function(){ var h=document.documentElement.scrollHeight-window.innerHeight; rbar.style.width=(h>0?Math.min(100,window.scrollY/h*100):0)+'%'; }, {passive:true});
    function paint(){ if(state.done){ btn.classList.add('is-done'); btn.textContent='Dokončeno ✓ (klikni pro zrušení)'; } else { btn.classList.remove('is-done'); btn.textContent='Označit jako dokončeno ✓'; } }
    function bindLesson(){
      document.querySelectorAll('#quiz .q .qq').forEach(function(q){ q.addEventListener('click', function(){ q.parentElement.classList.toggle('open'); }); });
      ['/assets/ba-diagrams.js?v=g1','/assets/lesson-audio.js?v=g1'].forEach(function(src){ var sc=document.createElement('script'); sc.src=src; document.body.appendChild(sc); });
    }
    function loadContent(){
      window.BA.getLessonHtml(LID).then(function(html){
        var el=document.getElementById('lbody'); if(!el) return;
        if(html){ el.innerHTML=html; bindLesson(); }
        else { el.innerHTML='<div class="card" style="text-align:center;">🔒 Obsah lekce se nepodařilo načíst. <a href="/akademie/prihlaseni/?next='+encodeURIComponent(location.pathname)+'">Přihlas se</a>, nebo stránku obnov.</div>'; }
      });
    }
    btn.addEventListener('click', function(){ state.done=!state.done; paint(); if(window.BA){ window.BA.setDone(PRODUCT, LID, state.done); } if(state.done){ setTimeout(function(){ location.href='/akademie/studium/'; }, 500); } });
    if (window.BA){
      window.BA.ready.then(function(){
        if (window.BA.mode==='live'){ window.BA.requireAccess(PRODUCT).then(function(ok){ if(!ok) return; loadContent(); window.BA.getProgress().then(function(d){ state.done=!!d[LID]; paint(); }); }); }
        else { loadContent(); window.BA.getProgress().then(function(d){ state.done=!!d[LID]; paint(); }); }
      });
    } else { loadContent(); }
  </script>
  <script src="/assets/scroll-top.js?v=g5" defer></script>
  <script src="/assets/ai-martin.js?v=g5" defer></script>
