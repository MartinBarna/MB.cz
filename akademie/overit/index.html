<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ověření certifikátu | Barna Academy</title>
<meta name="description" content="Ověř pravost certifikátu Barna Academy. Zadej ID certifikátu a zjisti, zda je držitel skutečně certifikovaný trenér nebo výživový poradce.">
<link rel="canonical" href="https://martinbarna.cz/akademie/overit/">
<meta property="og:type" content="website">
<meta property="og:title" content="Ověření certifikátu | Barna Academy">
<meta property="og:description" content="Certifikát Barna Academy: škola pro trenéry, výživové poradce i závodníky fitness. Ověř pravost certifikátu podle jeho ID.">
<meta property="og:url" content="https://martinbarna.cz/akademie/overit/">
<meta property="og:image" content="https://martinbarna.cz/assets/og/akademie.png?v=g7">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23EBB12C'/><text x='50' y='70' font-size='54' font-family='Arial' font-weight='bold' fill='%23161616' text-anchor='middle'>MB</text></svg>">
<link rel="stylesheet" href="/assets/vendor/fonts/poppins.css">
<style>
  :root { --gold:#EBB12C; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:'Poppins',Arial,sans-serif; color:#F0EADF; background:#0f0e12; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
  .card { background:#15141a; border:1px solid #2a2731; border-radius:2px; max-width:560px; width:100%; padding:40px 34px; text-align:center; }
  .logo { display:flex; align-items:center; justify-content:center; gap:10px; margin-bottom:.4rem; }
  .logo .mark { width:38px; height:38px; border-radius:4px; background:var(--gold); color:#161616; font-weight:800; display:flex; align-items:center; justify-content:center; }
  .logo b { font-size:1.05rem; letter-spacing:.5px; color:#fff; }
  h1 { font-size:1.7rem; margin:.6rem 0 .3rem; color:#fff; }
  p.sub { color:#b9b2a6; font-size:.95rem; margin-bottom:1.4rem; }
  .row { display:flex; gap:8px; }
  input { flex:1; border:1px solid #3a3542; background:#0f0e12; color:#F0EADF; border-radius:2px; padding:13px 20px; font-size:1rem; font-family:inherit; outline:none; }
  input:focus { border-color:var(--gold); }
  button { background:var(--gold); color:#161616; border:none; font-weight:700; padding:13px 26px; border-radius:0; clip-path:polygon(0 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%); cursor:pointer; font-size:1rem; font-family:'Barlow Condensed','Arial Narrow',Arial,sans-serif; text-transform:uppercase; letter-spacing:.07em; }
  button:hover { filter:brightness(1.07); }
  .result { margin-top:1.4rem; border-radius:2px; padding:20px; display:none; text-align:left; }
  .result.ok { display:block; background:#10201a; border:1px solid #245c3b; }
  .result.bad { display:block; background:#241214; border:1px solid #6e2a2a; }
  .result h3 { font-size:1.15rem; margin-bottom:.4rem; }
  .result.ok h3 { color:#5fce8a; } .result.bad h3 { color:#e9807a; }
  .result .meta { color:#cabfae; font-size:.95rem; line-height:1.7; }
  .result .meta a { color:var(--gold); }
  .result a { display:inline-block; margin-top:.8rem; color:var(--gold); font-weight:700; text-decoration:none; }
  .foot { margin-top:1.4rem; font-size:.85rem; color:#8d8677; }
  .foot a { color:var(--gold); }
</style>
</head>
<body>
  <div class="card">
    <div class="logo"><span class="mark">MB</span><b>BARNA ACADEMY</b></div>
    <h1>Ověření certifikátu</h1>
    <p class="sub">Zadej ID certifikátu a zjisti, zda je jeho držitel skutečně certifikovaný v Barna Academy.</p>
    <form id="f" class="row">
      <input id="q" type="text" placeholder="např. BA-2026-0001" autocomplete="off" aria-label="ID certifikátu">
      <button type="submit">Ověřit</button>
    </form>
    <div id="res" class="result"></div>
    <p class="foot">Barna Academy: škola pro trenéry, výživové poradce i závodníky fitness · <a href="/akademie/">Zpět na Academy</a></p>
  </div>

  <script src="/assets/ba-config.js?v=20260628b"></script>
  <script src="/assets/ba-academy.js?v=20260728a"></script>
  <script>
    var res = document.getElementById('res');
    function esc(s){ return String(s==null?'':s).replace(/[<>&"]/g,function(c){return {'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c];}); }
    function fmtDate(d){ if(!d) return ''; try{ var p=String(d).slice(0,10).split('-'); return p.length===3? (parseInt(p[2],10)+'. '+parseInt(p[1],10)+'. '+p[0]) : String(d); }catch(e){ return String(d); } }

    // Vyhledání certifikátu: live → Supabase RPC, demo/fallback → statický JSON.
    function lookup(id){
      var live = window.BA && window.BA.mode === 'live';
      if (live){
        return window.BA.verifyCertificate(id).then(function(row){
          if (row) return { jmeno: row.full_name, id: row.cert_id, datum: fmtDate(row.issued_at), program: row.program };
          return null;
        });
      }
      return fetch('/akademie/certifikaty.json?v=' + Date.now()).then(function(r){ return r.json(); }).then(function(list){
        return (list || []).find(function(x){ return (x.id || '').toUpperCase() === id; }) || null;
      });
    }

    document.getElementById('f').addEventListener('submit', function (e) {
      e.preventDefault();
      var id = document.getElementById('q').value.trim().toUpperCase();
      if (!id) return;
      res.className = 'result'; res.innerHTML = 'Ověřuji…'; res.style.display = 'block';
      var start = window.BA ? window.BA.ready : Promise.resolve();
      start.then(function(){ return lookup(id); }).then(function(c){
        if (c) {
          res.className = 'result ok';
          res.innerHTML = '<h3>✅ Platný certifikát</h3><div class="meta"><strong>Držitel:</strong> ' + esc(c.jmeno) +
            '<br><strong>ID:</strong> ' + esc(c.id) + '<br><strong>Vydáno:</strong> ' + esc(c.datum) +
            (c.program ? '<br><strong>Program:</strong> ' + esc(c.program) : '') + '</div>' +
            '<a href="/akademie/certifikat/?jmeno=' + encodeURIComponent(c.jmeno) + '&id=' + encodeURIComponent(c.id) + '&datum=' + encodeURIComponent(c.datum) + '">Zobrazit certifikát →</a>';
        } else {
          res.className = 'result bad';
          res.innerHTML = '<h3>❌ Certifikát nenalezen</h3><div class="meta">ID <strong>' + esc(id) + '</strong> jsme v registru nenašli. Zkontroluj přesné znění ID, nebo napiš na <a href="mailto:martin@martinbarna.cz">martin@martinbarna.cz</a>.</div>';
        }
      }).catch(function () {
        res.className = 'result bad';
        res.innerHTML = '<h3>Chyba ověření</h3><div class="meta">Zkus to prosím znovu za chvíli.</div>';
      });
    });

    // ?id=BA-2026-0001 (např. z LinkedIn certifikace) -> rovnou ověřit
    (function () {
      var pid = new URLSearchParams(location.search).get('id');
      if (!pid) return;
      document.getElementById('q').value = pid.trim();
      document.getElementById('f').dispatchEvent(new Event('submit', { cancelable: true }));
    })();
  </script>
  <script src="/assets/scroll-top.js?v=g13" defer></script>
<link rel="stylesheet" href="/assets/vendor/fonts/barlow-condensed.css"><link rel="stylesheet" href="/assets/arena.css?v=a8"></body>
</html>
