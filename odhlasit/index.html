<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
    <script src="/assets/theme-boot.js"></script>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex,nofollow">
<title>Odhlásit odběr e-mailů | Martin Barna</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: #0C0B10; margin: 0; padding: 40px 16px; color: #F0EADF;
  }
  html[data-theme="light"]{color-scheme:light;}
  html[data-theme="light"] body{background:#F7F3EB;color:#161310;color-scheme:light;}
  html[data-theme="light"] .card{background:#fff;border-color:rgba(22,19,16,.12);}
  html[data-theme="light"] p,html[data-theme="light"] .muted,html[data-theme="light"] .muted a,html[data-theme="light"] a.gdpr,html[data-theme="light"] .foot a{color:#5C564C;}
  .card {
    max-width: 480px; margin: 0 auto; background: #181520;
    border: 1px solid #262232; border-radius: 2px; padding: 32px; text-align: center;
  }
  .brand {
    border-left: 3px solid #EBB12C; padding-left: 10px; font-weight: 800; font-size: 13px;
    letter-spacing: .2em; text-transform: uppercase; color: #EBB12C; margin: 0 0 20px; text-align: left;
  }
  h1 { font-size: 20px; margin: 0 0 12px; }
  p { line-height: 1.55; color: #A09AAD; margin: 0 0 20px; }
  .btn {
    display: inline-block; background: #EBB12C; color: #1A1222; border: none; cursor: pointer;
    padding: 13px 26px; border-radius: 0; font-weight: 700; text-transform: uppercase;
    letter-spacing: .05em; font-size: 15px; font-family: inherit;
  }
  .btn:disabled { opacity: .55; cursor: default; }
  .muted { color: #8F8A99; font-size: 13px; }
  .muted a { color: #8F8A99; }
  a.gdpr { display: inline-block; color: #8F8A99; font-size: 13px; margin: 0 0 6px; }
  .foot { margin: 18px 0 0; }
  .foot a { color: #8F8A99; font-size: 13px; text-decoration: none; }
</style>
    <link rel="stylesheet" href="/assets/theme-light.css?v=l8">
</head>
<body>
  <div class="card">
    <div class="brand">Martin Barna</div>
    <h1 id="ttl">Odhlásit odběr e-mailů?</h1>
    <p id="msg">Klikni na tlačítko níže a už Ti žádné marketingové e-maily nepřijdou. Kdyby sis to rozmyslel/a, stačí si plán znovu stáhnout na webu.</p>
    <div id="act"></div>
    <p class="foot"><a href="https://martinbarna.cz">Zpět na martinbarna.cz</a></p>
  </div>

<script>
(function () {
  var ENDPOINT = "https://uhmrpfsdcujbhbtumqye.supabase.co/functions/v1/unsubscribe";
  var token = new URLSearchParams(location.search).get("token") || "";
  var ttl = document.getElementById("ttl");
  var msg = document.getElementById("msg");
  var act = document.getElementById("act");

  function show(t, m, html) {
    ttl.textContent = t;
    msg.textContent = m;
    act.innerHTML = html || "";
  }

  // POST na endpoint. Vraci {ok} nebo {erased}. GET nepouzivame (ten jen presmerovava sem).
  function post(action) {
    var u = ENDPOINT + "?token=" + encodeURIComponent(token) + (action ? "&action=" + action : "");
    return fetch(u, { method: "POST", headers: { "Content-Type": "application/json" }, body: "{}" })
      .then(function (r) { return r.json().catch(function () { return {}; }); });
  }

  function broken() {
    show("Odkaz nefunguje",
      "Tenhle odhlašovací odkaz už neplatí nebo je neúplný. Kdyžtak nám napiš přímo a vyřešíme to.");
  }

  function done() {
    show("Odhlášeno",
      "Hotovo, už Ti žádné marketingové e-maily nepřijdou. Kdyby sis to rozmyslel/a, stačí si plán znovu stáhnout na webu.",
      '<a class="gdpr" href="#" id="eraseLink">Chci úplně smazat svoje data z databáze (GDPR)</a>');
    document.getElementById("eraseLink").addEventListener("click", function (e) {
      e.preventDefault();
      // druhy krok proti nevratnemu omylu: erase je nevratny, chce vedomy druhy klik
      act.innerHTML =
        '<p style="color:#A09AAD;font-size:13px;margin:0 0 12px">Tohle je nevratné. Smažeme Tvůj e-mail, jméno, telefon i historii e-mailů. Opravdu?</p>' +
        '<button class="btn" id="eraseYes">Ano, smazat nadobro</button>';
      document.getElementById("eraseYes").addEventListener("click", function () {
        var b = document.getElementById("eraseYes");
        b.disabled = true; b.textContent = "Mažu…";
        post("erase").then(function (res) {
          if (res && res.erased) {
            show("Data smazána",
              "Tvoje data jsme nadobro vymazali z databáze: e-mail, jméno, telefon i historii e-mailů. U nás je to kompletně pryč.");
          } else {
            show("Nepovedlo se to",
              "Výmaz se teď nepodařil, nebo byla data smazána dříve. Kdyžtak nám napiš přímo a vyřešíme to.");
          }
        }).catch(function () {
          show("Nepovedlo se to", "Něco se nepovedlo. Zkus to prosím za chvíli znovu, nebo nám napiš.");
        });
      });
    });
  }

  function render() {
    if (!token) { broken(); return; }
    show("Odhlásit odběr e-mailů?",
      "Klikni na tlačítko níže a už Ti žádné marketingové e-maily nepřijdou. Kdyby sis to rozmyslel/a, stačí si plán znovu stáhnout na webu.",
      '<button class="btn" id="go">Potvrdit odhlášení</button>');
    var go = document.getElementById("go");
    go.addEventListener("click", function () {
      go.disabled = true;
      go.textContent = "Odhlašuji…";
      post("").then(function (res) {
        if (res && res.ok) { done(); } else { broken(); }
      }).catch(function () {
        go.disabled = false;
        go.textContent = "Potvrdit odhlášení";
        show("Nepovedlo se to",
          "Odhlášení se teď nepodařilo. Zkus to prosím za chvíli znovu, nebo nám napiš na tenhle e-mail a vyřešíme to.",
          '<button class="btn" id="go2">Zkusit znovu</button>');
        document.getElementById("go2").addEventListener("click", function () { location.reload(); });
      });
    });
  }

  render();
})();
</script>
<script src="/assets/scroll-top.js?v=g11" defer></script>
</body>
</html>
