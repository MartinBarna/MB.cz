<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<title>Promo stage</title>
<link rel="stylesheet" href="/assets/vendor/fonts/poppins.css">
<link rel="stylesheet" href="/assets/vendor/fonts/barlow-condensed.css">
<style>
  :root{
    --bg:#0f1113; --panel:#1a1c20; --txt:#f0eadf; --warm:#cabfb1; --mut:#aeb4ba;
    --acc:#EBB12C; --acc-l:#F6CD63; --ink:#161616;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1080px;height:1920px;overflow:hidden;background:var(--bg)}
  #stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:var(--bg);
    font-family:'Poppins',Arial,sans-serif;color:var(--txt)}
  .bg{position:absolute;inset:0;pointer-events:none}
  .glow{position:absolute;width:1400px;height:1400px;border-radius:50%;
    background:radial-gradient(circle, rgba(235,177,44,.20) 0%, rgba(235,177,44,.06) 38%, rgba(235,177,44,0) 70%)}
  .glow.g2{background:radial-gradient(circle, rgba(246,205,99,.12) 0%, rgba(246,205,99,0) 65%)}
  .grid{position:absolute;inset:0;opacity:.06;
    background-image:linear-gradient(rgba(255,255,255,.6) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.6) 1px,transparent 1px);
    background-size:90px 90px;mask-image:radial-gradient(ellipse at 50% 45%, #000 0%, transparent 70%)}
  .vign{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 50%, transparent 55%, rgba(0,0,0,.55) 100%)}

  .scene{position:absolute;inset:0;opacity:0}
  .a{will-change:transform,opacity}
  .txt{position:absolute;left:90px;right:90px}
  .h1{font:800 124px/0.98 'Barlow Condensed','Arial Narrow',sans-serif;letter-spacing:-.5px;color:var(--txt)}
  .h2{font:800 92px/1.0 'Barlow Condensed','Arial Narrow',sans-serif;letter-spacing:-.3px;color:var(--txt)}
  .sub{font:600 44px/1.32 'Poppins',sans-serif;color:var(--warm)}
  .acc{color:var(--acc)}
  .center{text-align:center}
  .kicker{font:700 36px/1.2 'Poppins',sans-serif;color:var(--acc);letter-spacing:1px}
  .rule{width:120px;height:8px;border-radius:4px;background:var(--acc)}

  /* karta se screenshotem */
  .card{position:absolute;overflow:hidden;border-radius:46px;background:#0b0c0e;
    border:3px solid rgba(235,177,44,.55);
    box-shadow:0 40px 90px rgba(0,0,0,.65),0 0 80px rgba(235,177,44,.14)}
  .card img{position:absolute;left:0;top:0;width:100%;display:block;transform-origin:50% 0}
  .card .fade-b{position:absolute;left:0;right:0;bottom:0;height:90px;background:linear-gradient(transparent,rgba(11,12,14,.85))}

  /* chat bublina */
  .bubble{position:absolute;padding:34px 46px;border-radius:44px 44px 12px 44px;
    background:#241a2b;border:3px solid #b04a8f;font:600 60px/1.2 'Poppins',sans-serif;color:#fff;white-space:nowrap}
  .caret{display:inline-block;width:5px;height:62px;background:#fff;margin-left:6px;vertical-align:-10px}

  /* řádky s ikonami */
  .row{position:absolute;left:90px;right:90px;display:flex;align-items:center;gap:40px}
  .ico{flex:0 0 132px;height:132px;border-radius:36px;border:3px solid rgba(235,177,44,.7);
    background:rgba(235,177,44,.08);display:flex;align-items:center;justify-content:center}
  .ico svg{width:74px;height:74px;stroke:var(--acc);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
  .row .lab{font:700 54px/1.15 'Poppins',sans-serif;color:var(--txt)}
  .row .desc{font:500 38px/1.3 'Poppins',sans-serif;color:var(--mut);margin-top:6px}

  /* čísla */
  .stat{position:absolute;left:90px;right:90px;text-align:center}
  .stat .num{font:800 230px/0.9 'Barlow Condensed',sans-serif;color:var(--acc);letter-spacing:-2px}
  .stat .lab{font:600 50px/1.2 'Poppins',sans-serif;color:var(--txt);margin-top:6px}

  /* citace */
  .quote{position:absolute;left:90px;right:90px;padding:56px 60px;border-radius:44px;background:var(--panel);
    border:3px solid rgba(235,177,44,.5)}
  .quote .q{font:700 64px/1.25 'Poppins',sans-serif;color:var(--txt)}
  .wave{display:flex;gap:12px;align-items:center;height:120px;margin-bottom:30px}
  .wave i{display:block;width:16px;border-radius:8px;background:var(--acc)}

  /* foto */
  .photo{position:absolute;inset:0;overflow:hidden}
  .photo img{position:absolute;width:100%;height:100%;object-fit:cover}
  .photo .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(15,17,19,.25) 0%,rgba(15,17,19,.15) 35%,rgba(15,17,19,.85) 62%,rgba(15,17,19,.97) 100%)}

  /* CTA */
  .logo{position:absolute;left:50%;height:84px;transform:translateX(-50%)}
  .price{position:absolute;left:60px;right:60px;text-align:center}
  .price .big{font:800 250px/0.88 'Barlow Condensed',sans-serif;color:var(--acc);letter-spacing:-3px}
  .price .unit{font:700 56px/1.2 'Poppins',sans-serif;color:var(--txt)}
  .box{position:absolute;left:90px;right:90px;padding:30px 40px;border-radius:32px;
    border:3px solid rgba(235,177,44,.6);background:rgba(235,177,44,.09);
    font:600 42px/1.3 'Poppins',sans-serif;color:var(--txt);text-align:center}
  .pill{position:absolute;left:50%;padding:30px 64px;border-radius:999px;background:var(--acc);color:var(--ink);
    font:800 62px/1 'Poppins',sans-serif;white-space:nowrap;box-shadow:0 18px 50px rgba(235,177,44,.35)}
  .small{position:absolute;left:90px;right:90px;text-align:center;font:500 36px/1.35 'Poppins',sans-serif;color:var(--mut)}

  /* objem po partiích */
  .bars{position:absolute;left:90px;right:90px}
  .bars .b{display:flex;align-items:center;gap:30px;margin-bottom:46px}
  .bars .bn{flex:0 0 230px;font:700 50px/1 'Poppins',sans-serif}
  .bars .track{flex:1;height:64px;border-radius:32px;background:#23262b;position:relative;overflow:hidden}
  .bars .fill{position:absolute;left:0;top:0;bottom:0;border-radius:32px}
  .bars .tag{flex:0 0 190px;font:700 40px/1 'Poppins',sans-serif;text-align:right}

  /* sloupcový layout v bezpečné zóně (y 270-1560) */
  .col{position:absolute;top:270px;height:1290px;left:90px;right:90px;display:flex;flex-direction:column;justify-content:center;gap:34px}
  .col.top{justify-content:flex-start}
  .col.bottom{justify-content:flex-end}
  .col > *{position:relative;left:auto;right:auto}
  .col .row{left:auto;right:auto}
  .col .pill{left:auto;align-self:center}
  .col .logo{left:auto;transform:none;align-self:center}
  .col .bubble{align-self:center}
  .col .card{flex:1 1 auto;align-self:center;min-height:300px}
  .rows{display:flex;flex-direction:column;gap:44px;margin-top:20px}
  .row{position:relative;left:auto;right:auto}
  .stats{display:flex;flex-direction:column;gap:60px}
  .stat{position:relative;left:auto;right:auto}
  .deco{align-self:center}
</style>
</head>
<body>
<div id="stage">
  <div class="bg">
    <div class="glow g1"></div>
    <div class="glow g2"></div>
    <div class="grid"></div>
    <div class="vign"></div>
  </div>
</div>
<script src="videos.js"></script>
<script src="engine.js"></script>
</body>
</html>
