name: Deploy na Wedos (FTP)

# Nasadí statický web na Wedos hosting přes FTP.
# POZOR: spouští se POUZE ručně (workflow_dispatch), aby to neselhávalo a
# nespamovalo maily, dokud nejsou nastavené FTP secrets. Po nastavení secrets
# se spustí ručně: Actions → "Deploy na Wedos (FTP)" → Run workflow.
# Vyžaduje 3 GitHub secrets (Settings → Secrets and variables → Actions):
#   FTP_SERVER, FTP_USERNAME, FTP_PASSWORD
# A volitelnou proměnnou FTP_SERVER_DIR (default /www/).

on:
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # ⛔ Node 20 je od 19. 9. 2025 na runnerech mrtvý a GitHub obě akce vynuceně
      # přepínal na Node 24 (varování v běhu #629). Povýšeno 21. 8. 2026 na verze,
      # které Node 24 deklarují samy: checkout v5 a FTP akce v4.4.0 (její jediná
      # změna proti v4.3.5 je právě „Update to node 24").
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Sitemap lastmod + staticky seznam cviku
        run: |
          node scripts/gen-cviky-html.mjs
          node scripts/gen-sitemap-lastmod.mjs

      # Veřejná čísla (potraviny, recepty, Academy) do HTML a llms.txt.
      # Musí běžet PŘED FTP, aby se nahrála už přepsaná verze; ověření níž
      # porovnává živý web proti `git stash create`, tedy proti pracovnímu stromu
      # PO tomhle kroku, takže mu přepis nevadí.
      # ⛔ NESMÍ SHODIT DEPLOY: nasazení webu je důležitější než stáří čísla.
      # Skript při chybě nezapíše NIC (dva průchody), takže se nahraje poslední
      # ručně ověřená hodnota: starší, ale pořád pravdivá. `::warning::` je tam
      # proto, aby se selhání neztratilo v zeleném běhu.
      # Klíč není potřeba: čte se anonymně přes RPC `cisla_pro_web()`. Secret je
      # jen záloha, když RPC vypadne, a když neexistuje, prostě se nepoužije.
      - name: Veřejná čísla do HTML a llms.txt
        env:
          ACADEMY_SERVICE_ROLE_KEY: ${{ secrets.ACADEMY_SERVICE_ROLE_KEY }}
        run: |
          node scripts/sync-cisla-web.mjs \
            || echo "::warning title=Veřejná čísla nepřepsána::sync-cisla-web.mjs selhal, web se nasazuje se stávajícími čísly. Důvod je v logu tohohle kroku."

      - name: Nahrát na Wedos přes FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          server-dir: ${{ vars.FTP_SERVER_DIR || '/www/' }}
          local-dir: ./
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            _import/**
            _zaloha/**
            _zdroje/**
            Logo-rebrand/**
            scripts/**
            akademie/_ai/**
            akademie/_pdf/**
            akademie/_supabase/**
            akademie/_videokurz/**
            **/*.md
            CNAME
            .nojekyll

      # Plošné ověření: každý nasazovaný soubor se stáhne z produkce a porovná s commitem
      # (git blob SHA). FTP akce umí kvůli sync-state souboru tiše přeskočit soubory
      # (stalo se 22. 7., run #438) — tenhle krok to shodí jako failed místo tichého úspěchu.
      # ⛔ NE proti HEAD: generátory výš mění pracovní strom (sitemap.xml, cviky),
      # takže se ověřuje proti `git stash create` = otisku PRACOVNÍHO STROMU po
      # generování. Proti HEAD to 25. 8. dvakrát falešně spadlo na sitemap.xml
      # a vyrobilo zmatek „co je vlastně nasazené".
      - name: Ověření nasazení (live obsah = nahrávaný strom)
        run: |
          sleep 8
          git config user.email ci@local && git config user.name CI
          REF=$(git stash create || true)
          node scripts/verify-deploy.js "${REF:-HEAD}"
